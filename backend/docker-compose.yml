services:
  postgres:
    image: postgres:16-alpine
    container_name: ecobite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecobite_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ecobite_pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: ecobite-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  ecobite_pgdata:
