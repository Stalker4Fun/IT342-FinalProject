spring:
  application:
    name: ecobite-backend
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

server:
  port: 8080

ecobite:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  admin:
    name: ${ADMIN_NAME:EcoBite System Admin}
    email: ${ADMIN_EMAIL:admin@ecobite.org}
    password: ${ADMIN_PASSWORD}
  mail:
    from: ${MAIL_FROM:no-reply@ecobite.local}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  reset-token:
    expiration-minutes: ${RESET_TOKEN_EXPIRATION_MINUTES:15}
